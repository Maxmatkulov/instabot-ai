name: kunlik-cron
# vercel.json'dagi cron'lar o'rniga. Toshkent 08:00 (UTC 03:00) — morning, 18:00 (UTC 13:00) — evening.
on:
  schedule:
    - cron: '0 3 * * *'
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      job:
        description: 'morning yoki evening'
        required: true
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Cron chaqirish
        env:
          BOT_URL: ${{ vars.BOT_URL }}
          CRON_SCHEDULE: ${{ github.event.schedule }}
          IN_JOB: ${{ github.event.inputs.job }}
        run: |
          if [ -z "$BOT_URL" ]; then echo "BOT_URL o'zgaruvchisi yo'q"; exit 1; fi
          case "$CRON_SCHEDULE" in
            "0 3 * * *") JOB=morning;; "0 13 * * *") JOB=evening;; *) JOB="$IN_JOB";;
          esac
          curl -fsS -A "vercel-cron/1.0" --max-time 300 --retry 3 --retry-delay 20 "${BOT_URL%/}/api/cron/$JOB"
