# Render.com — BEPUL (free) doimiy server. Vercel'dagi CPU limiti bu yerda yo'q.
services:
  - type: web
    name: instabot-ai
    runtime: node
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
